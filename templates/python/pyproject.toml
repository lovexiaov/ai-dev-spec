[project]
name = "myapp"
version = "0.1.0"
description = "Generated by ai-dev-spec (language-agnostic scaffold)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
