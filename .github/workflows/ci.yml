name: CI Gates
# 要点 3 的「硬约束」：把人工 review 难转成机器先守门。
# PR 任一阶段失败即阻断合并；与 AGENTS.md 的软约束保持一致。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 子模块本身就是 pnpm workspace 成员，不拉取则 install 必挂。
          # 三个仓库均已 public，默认 GITHUB_TOKEN 即可拉取，无需额外 PAT。
          submodules: recursive

      # 门禁会调用各语言子模块的构建链：Kotlin 2.0.x 编译器无法在 JDK 25（runner 默认）上运行
      # （Internal compiler error），且 JavaCompile 默认跟随运行 JDK 会导致 JVM-target 不一致。
      # 显式固定 JDK 17，与 android 子模块的 `kotlin { jvmToolchain(17) }` 对齐。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        # 不写 version：版本由 package.json 的 packageManager 决定。
        # 写死 version 会与之冲突并报 Multiple versions of pnpm specified。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Gates (neutral gate-runner)
        run: node tooling/gate-runner.mjs
        # 中立编排：发现 .toolchain.json → 按适配器跑 lint/typecheck/test/build。
        # 根仓库 .toolchain.json 声明 typescript 适配器，等价于原 eslint/tsc/vitest 流程；
        # 新增语言只需加一个 tooling/adapters/<lang>.mjs，CI 与根仓库零改动。
        # 必须覆盖 docs/specs/<feature>/spec.md 的验收条件。

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史才能扫描全部 commit
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 此处不设 cache：security job 不装依赖，pnpm store 目录不存在，
          # setup-node 的 post 步骤保存缓存时会报 Path Validation Error 并让 job 失败。

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        # 兜底：任何密钥泄露直接失败（对应 AGENTS.md NEVER 提交凭据）
      - name: Dependency audit
        run: pnpm audit --prod
        # 只审计运行时依赖：当前 13 条告警全部落在 dev 链路（vitest>vite / esbuild / minimatch），
        # 不随产物发布；升级 vitest 反而增至 15 条，故先按 --prod 口径守门。
        # 注意 pnpm audit 不接受 --frozen-lockfile（会报 unexpected argument）。
